plugins {
    id 'com.android.application'
}

def targetAbi = project.findProperty('targetAbi') ?: 'arm64-v8a'

android {
    namespace 'cn.xfangfang.wiliwili'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.xfangfang.wiliwili'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.6.0'
        ndkVersion '27.3.13750724'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-21',
                        '-DANDROID_STL=c++_shared',
                        '-DCMAKE_WARN_DEPRECATED=FALSE'
                abiFilters targetAbi
                version '3.22.1'
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include targetAbi
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // A debug keystore keeps CI artifacts installable without storing a
            // private signing key in the repository.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // CI stages only the selected ABI's shared libraries here. Keeping
            // headers, static archives, and pkg-config files out of jniLibs
            // prevents Gradle's JNI merge task from exhausting the heap.
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abi = output.getFilter("ABI")
            if (abi != null) {
                outputFileName = "wiliwili-${abi}.apk"
            }
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
