name: Android APK

on:
  push:
    branches: [yoga, android-port]
    paths:
      - 'CMakeLists.txt'
      - 'library/**'
      - 'wiliwili/**'
      - 'scripts/android/**'
      - 'app/platform/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'library/**'
      - 'wiliwili/**'
      - 'scripts/android/**'
      - 'app/platform/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config meson nasm wget ca-certificates \
            xz-utils bzip2 tar patch

      - name: Cache Android dependencies
        id: cache-android-dependencies
        uses: actions/cache@v4
        with:
          path: jniLibs/${{ matrix.abi }}
          key: wiliwili-android-${{ matrix.abi }}-${{ hashFiles('scripts/android/Makefile', 'scripts/android/*.meson') }}

      - name: Download dependency sources
        if: steps.cache-android-dependencies.outputs.cache-hit != 'true'
        run: make -C scripts/android TMPDIR="${{ runner.temp }}" ABI="${{ matrix.abi }}" download

      - name: Build Android dependencies
        if: steps.cache-android-dependencies.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: make -C scripts/android TMPDIR="${{ runner.temp }}" ABI="${{ matrix.abi }}" build

      - name: Build host libromfs generator
        run: |
          cmake -S library/borealis/library/lib/extern/libromfs/generator \
            -B library/borealis/build_libromfs_generator -G Ninja
          cmake --build library/borealis/build_libromfs_generator
          cp library/borealis/build_libromfs_generator/libromfs-generator \
            library/borealis/libromfs-generator
          rm -rf library/borealis/build_libromfs_generator

      - name: Build APK split
        working-directory: app/platform/android
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-android-${{ matrix.abi }}-${{ github.run_number }}
          path: app/platform/android/app/build/outputs/apk/release/wiliwili-${{ matrix.abi }}.apk
          if-no-files-found: error
